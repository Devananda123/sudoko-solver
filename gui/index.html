<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sudoku Solver Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Sudoku Solver Pro</h1>

<div class="top-bar">

<button id="themeBtn">🌙 Dark Mode</button>

<div class="stats">

<p>⏱ Time : <span id="timer">0.0 s</span></p>

<p>📊 Steps : <span id="steps">0</span></p>

<p>❤️ Lives : <span id="lives">❤️❤️❤️</span></p>

</div>

</div>

<div id="board"></div>

<div class="buttons">

<button id="solveBtn">Solve</button>

<button id="clearBtn">Clear</button>

<button id="generateBtn">Random</button>

</div>

</div>

<script src="themes.js"></script>
<script src="utils.js"></script>
<script src="puzzles.js"></script>
<script src="script.js"></script>
<script src="generator.js"></script>

</body>
</html>
